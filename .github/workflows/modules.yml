name: Retained module checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Independent integer references
        run: python3 scripts/verify_modules.py
      - name: Standalone module structure
        run: yosys -Q -T -s scripts/check_modules.ys
